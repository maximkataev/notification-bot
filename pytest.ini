[pytest]
# Pytest configuration for notification-bot

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode
asyncio_mode = auto

# Add markers
markers =
    asyncio: mark test as async (deselect with '-m "not asyncio"')
    slow: mark test as slow (deselect with '-m "not slow"')
    integration: mark test as integration test
    unit: mark test as unit test

# Minimum Python version
minversion = 7.0

# Timeout for tests (seconds)
timeout = 300

# Show output
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Test paths
testpaths = tests

# Coverage options (if pytest-cov installed)
# --cov=src --cov-report=html --cov-report=term-missing
